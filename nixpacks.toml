providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "yarn"]

[phases.install]
cmds = ["yarn install --frozen-lockfile"]

[phases.build]
cmds = ["yarn build"]

[start]
# Dokploy may not set PORT; default avoids serve's "option requires argument: -l".
# Bind all interfaces so Docker port mapping works.
cmd = "sh -c \"npx serve dist -s -l tcp://0.0.0.0:${PORT:-3000}\""
