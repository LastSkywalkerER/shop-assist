<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2481cc" />
    <title>Shop Assist</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: var(--tg-theme-bg-color, #ffffff); }
      #app-boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; }
      #app-boot .spinner { width: 28px; height: 28px; border: 3px solid rgba(36,129,204,0.18); border-top-color: #2481cc; border-radius: 50%; animation: app-boot-spin 0.8s linear infinite; }
      #app-boot .label { color: #707579; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html, body { background: var(--tg-theme-bg-color, #17212b); }
        #app-boot .label { color: #7a8b99; }
      }
    </style>
    <script async src="https://telegram.org/js/telegram-web-app.js" onerror="this.remove()"></script>
  </head>
  <body>
    <div id="root">
      <div id="app-boot">
        <div class="spinner"></div>
        <div class="label">Загрузка...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
